name: CI/CD
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build & Test
        run: dotnet restore && dotnet build --no-restore && dotnet test --no-build
      - name: Get short SHA
        id: commit
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
      - name: Docker
        if: github.event_name == 'push'
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest \
                       -t ghcr.io/${{ github.repository }}:${{ steps.commit.outputs.short_sha }} .
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repositury }}:latest
          docker push ghcr.io/${{ github.reposirory }}:${{ steps.commit.outputs.short_sha }}
